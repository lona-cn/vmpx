name: Publish Wine container

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-windows-payload:
    name: Build Windows x64 container payload
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decrypt VMProtect_Con for container
        shell: pwsh
        env:
          VMPROTECT_CON_PASSPHRASE: ${{ secrets.VMPROTECT_CON_PASSPHRASE }}
        run: |
          if ([string]::IsNullOrEmpty($env:VMPROTECT_CON_PASSPHRASE)) {
            throw 'Repository secret VMPROTECT_CON_PASSPHRASE is required to build the Wine container.'
          }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw '7-Zip was not found under Program Files.' }
          $archive = Join-Path $env:GITHUB_WORKSPACE 'app/binaries/VMProtect_Con.zip'
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE 'app/binaries'
          & $sevenZip x $archive "-o$outputDirectory" '-y' '-bd' "-p$env:VMPROTECT_CON_PASSPHRASE"
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path (Join-Path $outputDirectory 'VMProtect_Con.exe') -PathType Leaf)) {
            throw 'VMProtect_Con.exe was not extracted.'
          }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
          build-cache: true
          build-cache-path: build/.build_cache
          build-cache-key: windows-x64-msvc-release-vs2026

      - name: Cache XMake dependencies
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\.xmake\packages
          key: xmake-3.1.1-${{ runner.os }}-x64-msvc-mt-${{ hashFiles('**/xmake.lua') }}

      - name: Build Windows server
        shell: cmd
        run: |
          xmake f -c -p windows -a x64 -m release --runtimes=MT -o build --policies=package.precompiled:n,package.install_only,build.ccache:y -vy
          if errorlevel 1 exit /b %errorlevel%
          xmake build -vDy vmpx_server
          if errorlevel 1 exit /b %errorlevel%

      - name: Stage and verify container payload
        shell: pwsh
        run: |
          $matches = @(Get-ChildItem -Path build -Filter vmpx_server.exe -Recurse -File)
          if ($matches.Count -ne 1) { throw "Expected one vmpx_server.exe, found $($matches.Count)" }
          $root = $matches[0].Directory.FullName
          $payload = Join-Path $env:GITHUB_WORKSPACE 'docker-payload'
          $staticSource = Join-Path $env:GITHUB_WORKSPACE 'app/assets/main/static'
          $requiredFiles = @(
            $matches[0].FullName
            (Join-Path $root 'KeyGen64.dll')
            (Join-Path $root 'config/log4cplus.properties')
            (Join-Path $staticSource 'index.html')
            (Join-Path $env:GITHUB_WORKSPACE 'app/binaries/VMProtect_Con.exe')
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing container input: $file" }
          }
          Remove-Item -LiteralPath $payload -Recurse -Force -ErrorAction SilentlyContinue
          $staticDestination = Join-Path $payload 'assets/static'
          $configDestination = Join-Path $payload 'config'
          New-Item -ItemType Directory -Path $staticDestination, $configDestination -Force | Out-Null
          Copy-Item -LiteralPath $matches[0].FullName -Destination $payload
          Copy-Item -LiteralPath (Join-Path $root 'KeyGen64.dll') -Destination $payload
          Copy-Item -Path (Join-Path $staticSource '*') -Destination $staticDestination -Recurse -Force
          Copy-Item -Path (Join-Path $root 'config/*') -Destination $configDestination -Recurse -Force -Exclude '.gitkeep'
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'app/binaries/VMProtect_Con.exe') -Destination $payload
          if ((Get-Item -LiteralPath (Join-Path $payload 'vmpx_server.exe')).Length -eq 0) { throw 'Staged vmpx_server.exe is empty.' }

      - uses: actions/upload-artifact@v7
        with:
          name: wine-container-payload
          path: docker-payload/
          if-no-files-found: error
          retention-days: 1

      - name: Remove decrypted VMProtect executable
        if: always()
        shell: pwsh
        run: Remove-Item app/binaries/VMProtect_Con.exe -Force -ErrorAction SilentlyContinue

  publish:
    name: Build, verify, and publish linux/amd64 image
    needs: build-windows-payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare Docker build context
        uses: actions/download-artifact@v8
        with:
          name: wine-container-payload
          path: ${{ runner.temp }}/vmpx-docker-context/payload

      - name: Add Dockerfile and entrypoint to build context
        shell: bash
        run: |
          cp docker/vmpx-wine/Dockerfile '${{ runner.temp }}/vmpx-docker-context/Dockerfile'
          cp docker/vmpx-wine/entrypoint.sh '${{ runner.temp }}/vmpx-docker-context/entrypoint.sh'
          test -s '${{ runner.temp }}/vmpx-docker-context/payload/vmpx_server.exe'
          test -s '${{ runner.temp }}/vmpx-docker-context/payload/VMProtect_Con.exe'

      - uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lona-cn/vmpx
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/vmpx-docker-context
          file: ${{ runner.temp }}/vmpx-docker-context/Dockerfile
          platforms: linux/amd64
          load: true
          tags: vmpx-wine:ci
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Verify executables inside image
        shell: bash
        run: |
          server_expected=$(sha256sum '${{ runner.temp }}/vmpx-docker-context/payload/vmpx_server.exe' | cut -d ' ' -f 1)
          server_actual=$(docker run --rm --entrypoint /bin/sh vmpx-wine:ci -ec 'test -s /opt/vmpx/vmpx_server.exe; sha256sum /opt/vmpx/vmpx_server.exe' | cut -d ' ' -f 1)
          test "$server_expected" = "$server_actual"
          docker run --rm --entrypoint /bin/sh vmpx-wine:ci -ec '
            test -s /opt/vmpx/VMProtect_Con.exe
            test -s /opt/vmpx/KeyGen64.dll
            test -s /opt/vmpx/config/log4cplus.properties
            test -s /opt/vmpx/assets/static/index.html
          '

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image tags
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        shell: bash
        run: |
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            docker tag vmpx-wine:ci "$image"
            docker push "$image"
          done <<< "$IMAGE_TAGS"
