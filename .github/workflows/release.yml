name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decrypt VMProtect_Con for CI
        shell: pwsh
        env:
          VMPROTECT_CON_PASSPHRASE: ${{ secrets.VMPROTECT_CON_PASSPHRASE }}
        run: |
          if ([string]::IsNullOrEmpty($env:VMPROTECT_CON_PASSPHRASE)) {
            if ($env:GITHUB_EVENT_NAME -eq 'push') {
              throw 'Repository secret VMPROTECT_CON_PASSPHRASE is required for push workflows.'
            }
            Write-Host 'Passphrase unavailable; skipping VMProtect extraction for this event.'
            exit 0
          }

          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw '7-Zip was not found under Program Files.' }
          $archive = Join-Path $env:GITHUB_WORKSPACE 'app/binaries/VMProtect_Con.zip'
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE 'app/binaries'
          & $sevenZip x $archive "-o$outputDirectory" '-y' '-bd' "-p$env:VMPROTECT_CON_PASSPHRASE"
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path (Join-Path $outputDirectory 'VMProtect_Con.exe') -PathType Leaf)) {
            throw 'VMProtect_Con.exe was not extracted.'
          }

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
          build-cache: true
          build-cache-path: build/.build_cache
          build-cache-key: windows-x64-msvc-release-vs2026

      - name: Cache XMake dependencies
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\.xmake\packages
          key: xmake-3.1.1-${{ runner.os }}-x64-msvc-mt-${{ hashFiles('**/xmake.lua') }}

      - name: Build release server
        shell: cmd
        run: |
          xmake f -c -p windows -a x64 -m release --runtimes=MT -o build --policies=package.precompiled:n,package.install_only,build.ccache:y -vy
          if errorlevel 1 exit /b %errorlevel%
          xmake build -vDy vmpx_server

      - name: Build and smoke-test VMProtect SDK demo
        shell: cmd
        run: |
          xmake build vmprotect_sdk_demo
          if errorlevel 1 exit /b %errorlevel%
          xmake run vmprotect_sdk_demo --expect-unprotected
          if errorlevel 1 exit /b %errorlevel%

      - name: Run C++ regression tests
        shell: cmd
        run: |
          xmake build test_serialgen
          if errorlevel 1 exit /b %errorlevel%
          xmake run test_serialgen
          if errorlevel 1 exit /b %errorlevel%
          xmake build test_zip
          if errorlevel 1 exit /b %errorlevel%
          xmake run test_zip
          if errorlevel 1 exit /b %errorlevel%
          xmake build test_activation
          if errorlevel 1 exit /b %errorlevel%
          xmake run test_activation
          if errorlevel 1 exit /b %errorlevel%
          xmake build test_packprocess
          if errorlevel 1 exit /b %errorlevel%
          xmake run test_packprocess
          if errorlevel 1 exit /b %errorlevel%

      - name: Remove decrypted VMProtect_Con
        if: always()
        shell: pwsh
        run: |
          Remove-Item app/binaries/VMProtect_Con.exe -Force -ErrorAction SilentlyContinue

      - name: Package runnable server
        shell: pwsh
        run: |
          $matches = @(Get-ChildItem -Path build -Filter vmpx_server.exe -Recurse -File)
          if ($matches.Count -ne 1) { throw "Expected one vmpx_server.exe, found $($matches.Count)" }
          $root = $matches[0].Directory.FullName
          $staticSource = Join-Path $env:GITHUB_WORKSPACE 'app/assets/main/static'
          $requiredFiles = @(
            $matches[0].FullName
            (Join-Path $root 'KeyGen64.dll')
            (Join-Path $root 'config/log4cplus.properties')
            (Join-Path $staticSource 'index.html')
            (Join-Path $env:GITHUB_WORKSPACE 'LICENSE')
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing runtime release input: $file" }
          }

          $stage = Join-Path $env:RUNNER_TEMP 'vmpx-release'
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          $stageStatic = Join-Path $stage 'assets/static'
          $stageConfig = Join-Path $stage 'config'
          New-Item -ItemType Directory -Path $stageStatic, $stageConfig -Force | Out-Null
          Copy-Item -LiteralPath $matches[0].FullName -Destination $stage
          Copy-Item -LiteralPath (Join-Path $root 'KeyGen64.dll') -Destination $stage
          Copy-Item -Path (Join-Path $staticSource '*') -Destination $stageStatic -Recurse -Force
          Copy-Item -Path (Join-Path $root 'config/*') -Destination $stageConfig -Recurse -Force -Exclude '.gitkeep'
          Copy-Item -LiteralPath 'LICENSE' -Destination $stage

          Remove-Item -Path dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archive = "dist/vmpx-windows-x64-$($env:GITHUB_SHA.Substring(0, 12)).zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: vmpx-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          name: vmpx-windows-x64
          path: dist

      - name: Publish version or snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            title="VMPX $tag"
            release_flags=(--verify-tag)
            if [[ "$tag" == *-* ]]; then
              release_flags+=(--prerelease --latest=false)
            fi
          else
            tag="snapshot-${GITHUB_SHA}"
            title="VMPX ${GITHUB_SHA:0:12}"
            release_flags=(--prerelease --latest=false)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi

          gh release create "$tag" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "Automated Windows x64 build for $tag. VMProtect_Con.exe is not included; a licensed copy is required for packing." \
            "${release_flags[@]}"
